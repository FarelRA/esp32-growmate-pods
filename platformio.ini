[env:esp32cam]
platform = espressif32
board = esp32cam
framework = espidf
board_build.partitions = partitions.csv
upload_port = /dev/ttyACM0
upload_speed = 115200
upload_flags =
    --before
    no_reset
    --after
    no_reset
    --no-stub
upload_command = python $PROJECT_PACKAGES_DIR/tool-esptoolpy/esptool.py --chip esp32 --port $UPLOAD_PORT --baud $UPLOAD_SPEED --before no_reset --after no_reset --no-stub write_flash -z --flash_mode dio --flash_freq 80m --flash_size 4MB 0x1000 $BUILD_DIR/bootloader.bin 0x8000 $BUILD_DIR/partitions.bin 0x10000 $BUILD_DIR/firmware.bin
monitor_rts = 0
monitor_dtr = 0
