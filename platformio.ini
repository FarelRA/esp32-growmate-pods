; GrowMate Pods (ESP32-CAM, indoor plant pod).
; Wiring: docs/04-wiring.md. Flash procedure: docs/07-operations.md.
; Managed deps: src/idf_component.yml
[env:growmate-pods]
platform = espressif32
board = esp32cam
framework = espidf
board_build.partitions = partitions.csv
; ESP32-CAM has no auto-reset circuit (external UART adapter): flashing needs
; no_reset/no-stub esptool plus a manual IO0-GND link at power-on.
upload_command = $PROJECT_DIR/tools/flash.sh $UPLOAD_PORT $UPLOAD_SPEED $BUILD_DIR $PROJECT_PACKAGES_DIR
monitor_rts = 0
monitor_dtr = 0

; Host unit tests: PlatformIO Unity engine, no hardware required.
; Runs the suites in test/test_*/ against the pure-logic modules plus the
; firmware translation units that compile against the host HAL fakes in
; src/test_support/ (stubs + fake_runtime + vendored cJSON). The fakes are
; compiled here only -- the firmware build (src/CMakeLists.txt) never lists
; them, so the ESP-IDF target is unaffected.
[env:native]
platform = native
test_framework = unity
test_build_src = true
extra_scripts = tools/pio_native_coverage.py
build_src_filter =
  +<*.c>
  +<*.h>
  +<test_support/cjson/cJSON.c>
  +<test_support/fakes/fake_runtime.c>
  -<main.c>
  -<api_client.c>
  -<onboarding.c>
  -<network_manager.c>
  -<camera_service.c>
  -<ota_service.c>
build_flags =
  -Isrc/test_support/stubs
  -Isrc/test_support/cjson
  -Isrc/test_support/fakes
  -Isrc/test_support
  -DPIO_UNIT_TEST
  -include esp_check.h
  -g -O0 --coverage
